interface:
  display_name: "日本の賃貸物件を探して検証する"
  short_description: "地域別に候補を集め、物件ごとの検証と独立した再確認を経て、統合担当が比較結果をまとめる"
  default_prompt: "$find-rental-in-japanを使って、私の条件に合う日本の賃貸物件を探してください。主エージェントが進行を管理し、統合担当（merge resolver）が候補の重複を除いてください。各物件エージェントは全項目を検証し、自ら独立した再確認エージェントを作成してください。最後に、統合担当が調査結果を1つの比較資料にまとめて提出してください。"
